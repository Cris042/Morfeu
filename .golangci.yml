version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - errorlint
    - gosec
    - gocognit
    - nestif
    - funlen
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - depguard
    - exhaustive

  settings:
    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50

    nestif:
      min-complexity: 5

    # Comentários deste repo são em pt-BR; o dicionário US do misspell flagra
    # palavras portuguesas parecidas com typos ingleses. Lista mínima, só o
    # que já foi flagrado — não desabilitar o linter (ele segue pegando typos
    # reais em identificadores/strings em inglês).
    misspell:
      ignore-rules:
        - exponencial
        - argumentos
        - momento
        - intencional
        - excepcional
        # "conversão" é tokenizado como "convers" (o "ã" quebra a palavra)
        - convers
        - intervalos
        # task 0008
        - metricas
        - instrumentos
        - validade
        - invalidas

    # Arquivos gerados (sqlc) já são excluídos por linters.exclusions.generated
    # (a antiga chave revive.ignore-generated-header não existe no schema v2 —
    # o `config verify` da action rejeita o arquivo inteiro).
    revive:
      severity: error
      rules:
        - name: blank-imports
          severity: error
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: error
        - name: early-return
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: superfluous-else
          severity: warning

    depguard:
      rules:
        # Regra geral: biblioteca legada proibida em todo o módulo.
        main:
          list-mode: lax
          deny:
            - pkg: "io/ioutil"
              desc: "use io ou os no lugar de io/ioutil"

        # Fronteiras do ADR 0003 (§Decisão, regra 4) para o módulo de domínio catalogo:
        # (1) módulo não importa módulo — só o que está no allow é permitido (regra
        #     nasce pronta para quando E0b adicionar outros módulos de domínio);
        # (2) domínio não importa driver de infra direto — pgx e go-redis só no
        #     internal/catalogo/db gerado (fora deste glob) e em internal/cache
        #     (plataforma, importado via interface cache.Cache).
        # Testes (_test.go) ficam fora: ADR 0006 exige testcontainers reais (PG/Redis)
        # no nível do handler, o que exige montar a infra real no teste.
        catalogo-domain:
          files:
            - "**/internal/catalogo/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/labstack/echo/v4
            - github.com/google/uuid
            - go.uber.org/zap
            - github.com/mclovin137/morfeu/internal/cache
            - github.com/mclovin137/morfeu/internal/catalogo/db
            - github.com/mclovin137/morfeu/internal/outbox
          deny:
            - pkg: "github.com/jackc/pgx/v5"
              desc: "domínio catalogo não importa driver pgx direto — depende do DAO gerado internal/catalogo/db ou dos aliases de internal/outbox (Pool/Tx)"
            - pkg: "github.com/redis/go-redis/v9"
              desc: "domínio catalogo não importa driver redis direto — depende de internal/cache"
            - pkg: "github.com/rabbitmq/amqp091-go"
              desc: "domínio catalogo não importa o cliente AMQP — publica só via internal/outbox.Enqueue (RF01, ADR 0003)"

        # Fronteira do ADR 0003/RNF03 do PRD 0002: amqp091-go só é importável em
        # internal/broker. Testes ficam fora (CA02 exige consumo AMQP cru dentro
        # do teste de integração para verificar o envelope publicado, RF05).
        broker-boundary:
          files:
            - "!**/internal/broker/*.go"
            - "!$test"
          list-mode: lax
          deny:
            - pkg: "github.com/rabbitmq/amqp091-go"
              desc: "amqp091-go só é importável em internal/broker (ADR 0003, RNF03 do PRD 0002)"

        # Fronteira do PRD 0008 (RNF02): o JWT só é emitido/validado em
        # internal/autenticacao — módulos autorizam via autenticacao.Exigir e
        # nunca manipulam tokens diretamente. Testes de fora podem forjar tokens.
        # Módulo identidade (PRD 0009 RNF01): transaction script sem driver.
        identidade-domain:
          files:
            - "**/internal/identidade/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/labstack/echo/v4
            - github.com/google/uuid
            - go.uber.org/zap
            - golang.org/x/crypto/argon2
            - github.com/mclovin137/morfeu/internal/autenticacao
            - github.com/mclovin137/morfeu/internal/identidade/db

        # Ninguém importa o módulo identidade (ADR 0003): outros módulos
        # autorizam via internal/autenticacao. Só o composition root o monta.
        identidade-isolada:
          files:
            - "!**/internal/identidade/**"
            - "!**/cmd/morfeu/*.go"
            - "!$test"
          list-mode: lax
          deny:
            - pkg: "github.com/mclovin137/morfeu/internal/identidade"
              desc: "módulos não importam identidade — use internal/autenticacao (ADR 0003, PRD 0009)"

        jwt-boundary:
          files:
            - "!**/internal/autenticacao/*.go"
            - "!$test"
          list-mode: lax
          deny:
            - pkg: "github.com/golang-jwt/jwt"
              desc: "golang-jwt só é importável em internal/autenticacao (ADR 0003, PRD 0008)"

  exclusions:
    generated: strict

issues:
  max-same-issues: 10
  max-issues-per-linter: 100

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

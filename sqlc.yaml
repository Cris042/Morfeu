version: "2"
sql:
  - schema:
      - "./migrations/001_initial_schema.up.sql"
      - "./migrations/004_catalogo_filmes_projetados.up.sql"
      - "./migrations/007_filmes.up.sql"
    queries: "./internal/catalogo/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/catalogo/db"
        package: "db"
        emit_db_tags: true
        emit_interface: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
  # Ownership excepcional da plataforma (RN03, PRD 0002): outbox_events não
  # pertence a nenhum domínio. Schema restrito à sua própria migration para
  # não vazar o modelo Film (de 001) — e vice-versa — entre os dois DAOs
  # gerados (cada bloco só enxerga a tabela que lhe pertence).
  # processed_messages (003, task 0005) tem o mesmo ownership de plataforma.
  - schema:
      - "./migrations/002_outbox_events.up.sql"
      - "./migrations/003_processed_messages.up.sql"
    queries: "./internal/outbox/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/outbox/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
  # Módulo identidade (task 0009): dono exclusivo da tabela usuario.
  - schema:
      - "./migrations/005_usuario.up.sql"
      - "./migrations/006_refresh_token.up.sql"
    queries: "./internal/identidade/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/identidade/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Domínio sem pgtype (RNF01 do PRD 0009): timestamptz ↔ time.Time.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
  # Módulo sessao (task 0013): dono de salas e sessoes. O schema inclui 001 e
  # 007 só para o parser resolver a FK para filmes — nenhuma query lê filmes.
  - schema:
      - "./migrations/001_initial_schema.up.sql"
      - "./migrations/007_filmes.up.sql"
      - "./migrations/008_salas_sessoes.up.sql"
    queries: "./internal/sessao/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/sessao/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
  # Módulo reserva (task 0015): dono exclusivo de holds (a FK para sessoes é
  # só integridade declarada — nenhuma query lê sessoes).
  - schema:
      - "./migrations/009_holds.up.sql"
      - "./migrations/010_holds_pedido.up.sql"
    queries: "./internal/reserva/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/reserva/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
  # Módulo pedido (PRD 0023): só as próprias tabelas (ADR 0003).
  - schema:
      - "./migrations/011_pedidos.up.sql"
    queries: "./internal/pedido/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/pedido/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"

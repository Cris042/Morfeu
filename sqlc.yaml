version: "2"
sql:
  - schema:
      - "./migrations/001_initial_schema.up.sql"
      - "./migrations/004_catalogo_filmes_projetados.up.sql"
    queries: "./internal/catalogo/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/catalogo/db"
        package: "db"
        emit_db_tags: true
        emit_interface: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
  # Ownership excepcional da plataforma (RN03, PRD 0002): outbox_events não
  # pertence a nenhum domínio. Schema restrito à sua própria migration para
  # não vazar o modelo Film (de 001) — e vice-versa — entre os dois DAOs
  # gerados (cada bloco só enxerga a tabela que lhe pertence).
  # processed_messages (003, task 0005) tem o mesmo ownership de plataforma.
  - schema:
      - "./migrations/002_outbox_events.up.sql"
      - "./migrations/003_processed_messages.up.sql"
    queries: "./internal/outbox/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/outbox/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
  # Módulo identidade (task 0009): dono exclusivo da tabela usuario.
  - schema: "./migrations/005_usuario.up.sql"
    queries: "./internal/identidade/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/identidade/db"
        package: "db"
        emit_db_tags: true
        emit_interface: false
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

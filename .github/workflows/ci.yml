# Pipeline de CI — peça mecânica do gate híbrido de auditoria (roles.md §6.4).
# PRD 0004: gates bloqueantes em runner ARM64 nativo (ubuntu-24.04-arm, gratuito
# em repositório público) + build linux/arm64 → GHCR + smoke da imagem.
# Supply chain: actions pinadas por SHA completo; ferramentas com versão fixada
# (RNF01/RNF03); permissions mínimas por job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080" # gitleaks_8.30.1_linux_arm64.tar.gz
  GOVULNCHECK_VERSION: "v1.6.0"
  SQLC_VERSION: "v1.31.1"
  MIGRATE_VERSION: "v4.19.1"
  IMAGE: ghcr.io/mclovin137/morfeu

jobs:
  # Gates estáticos, na ordem de custo do PRD: lint → vet → gitleaks → govulncheck → sqlc
  gates:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout (histórico completo — gitleaks varre todos os commits)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Último patch da 1.25 (não o 1.25.0 exato do go.mod): os patches de
          # segurança da stdlib contam para o gate do govulncheck.
          go-version: "1.25.x"
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2 # mesma versão validada localmente (RNF03)

      - name: go vet
        run: go vet -tags=integration ./...

      - name: gitleaks (working tree + histórico)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .
          ./gitleaks dir --no-banner --redact .

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

      - name: sqlc vet + código gerado sem diff
        run: |
          # sqlc 1.31.x exige Go >= 1.26 p/ compilar; GOTOOLCHAIN=auto baixa o
          # toolchain só para a ferramenta (o projeto continua no 1.25.x).
          GOTOOLCHAIN=auto go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
          sqlc vet
          sqlc diff

  # Suíte completa com -race e testcontainers reais (PG + Redis) em ARM64
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Último patch da 1.25 (não o 1.25.0 exato do go.mod): os patches de
          # segurança da stdlib contam para o gate do govulncheck.
          go-version: "1.25.x"
          check-latest: true

      - name: go test -race (suíte completa)
        run: go test -race -tags=integration ./...

  # Detecta se o diff toca migrations/** (RF02 — job condicional por path)
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            migrations:
              - 'migrations/**'

  # Valida migrations em PG efêmero: up → down → up (roda SÓ se o diff toca migrations/**)
  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morfeu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Último patch da 1.25 (não o 1.25.0 exato do go.mod): os patches de
          # segurança da stdlib contam para o gate do govulncheck.
          go-version: "1.25.x"
          check-latest: true

      - name: migrate up → down → up
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/morfeu_ci?sslmode=disable
        run: |
          go install -tags 'postgres' "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}"
          migrate -path migrations -database "$DB_URL" up
          migrate -path migrations -database "$DB_URL" down -all
          migrate -path migrations -database "$DB_URL" up

      - name: sqlc vet (schema recém-migrado)
        run: |
          GOTOOLCHAIN=auto go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
          sqlc vet

  # Build linux/arm64 nativo (sem QEMU) + smoke da imagem; push no GHCR só na main
  build:
    needs: [gates, test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morfeu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — imagem sobe com PG/Redis reais e responde /health 200
        # -mode=api: o smoke valida boot + migrations + /health; a partir da
        # task 0002 o modo default (all) exige RabbitMQ no startup (fail-fast
        # do relay), e o broker não faz parte da infra deste smoke — o caminho
        # do relay é coberto pela suíte de integração no job test.
        # JWT_SEGREDO (task 0009): a API não sobe sem ele; segredo efêmero por run.
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL="postgres://postgres:postgres@localhost:5432/morfeu?sslmode=disable" \
            -e REDIS_URL="localhost:6379" \
            -e JWT_SEGREDO="$(openssl rand -hex 32)" \
            "${IMAGE}:sha-${GITHUB_SHA}" -mode=api
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Smoke falhou — /health não respondeu 200"
            docker logs smoke || true
            exit 1
          fi
          curl -s http://localhost:8080/health
          docker rm -f smoke

      - name: Push GHCR (sha + latest — só na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  # Check único exigido pela branch protection (RF01/CA08): falha se qualquer
  # job necessário falhou; `migrations` pulado (path-filter) conta como sucesso.
  ci:
    needs: [gates, test, changes, migrations, build]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Consolidar resultados
        run: |
          echo "resultados: ${{ join(needs.*.result, ', ') }}"
          if echo "${{ join(needs.*.result, ' ') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::Ao menos um gate falhou"
            exit 1
          fi
          echo "todos os gates verdes"

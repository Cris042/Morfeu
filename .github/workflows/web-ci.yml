# CI da SPA (PRD 0017 RF08, ADR 0009) — paralelo ao CI Go, só quando web/ muda.
# Mesmo padrão de supply chain do ci.yml: actions pinadas por SHA, runner ARM64,
# permissions mínimas. npm audit (high+) é gate, como o govulncheck no Go.
name: Web CI

on:
  push:
    branches: [main]
    paths: ["web/**", "configs/caddy/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", "configs/caddy/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node (versão do .nvmrc, cache do npm)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar (lockfile exato)
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # A demonstração do mapa (/_demo/mapa) só existe em dev (PRD 0019 RF06).
      - name: Demo fora do bundle de produção
        run: "! grep -rl '_demo/mapa' dist/"

      # Pagamento de teste só em builds com VITE_PAGAMENTO_MODO=fake e nenhum
      # segredo do Stripe no bundle (PRD 0033; refinamento E8).
      - name: Sem pagamento de teste nem segredo no bundle de produção
        run: |
          ! grep -rl -e '__teste' -e 'Pagar (teste)' dist/
          ! grep -rlE 'sk_(test|live)_|rk_(test|live)_|whsec_' dist/

      # O E2E roda sob a mesma CSP do Caddy (PRD 0035): a cópia do preview
      # não pode divergir da fonte.
      - name: CSP do preview igual à do Caddy
        run: |
          csp=$(grep -o 'Content-Security-Policy "[^"]*"' ../configs/caddy/seguranca.caddy | sed 's/^Content-Security-Policy "//; s/"$//')
          test -n "$csp"
          # Linha exata (sem texto extra antes/depois da política).
          grep -qxF "  \"$csp\"" vite.config.ts

      - name: Auditoria de dependências (gate)
        run: npm audit --audit-level=high

# Prometheus do Morfeu (task 0007, RF01). Scrape pela rede interna do compose;
# nenhum destes endpoints é publicado no host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # App (/metrics da task 0006): golden signals + mensageria.
  - job_name: morfeu
    static_configs:
      - targets: ["app:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Plugin nativo rabbitmq_prometheus: métricas agregadas.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Métricas por fila (prontas, consumidores) — base dos alertas de DLQ e de
  # consumidor parado. Poucas filas: cardinalidade controlada.
  - job_name: rabbitmq-filas
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Datasources provisionados (task 0007, RF05; Tempo na task 0040). UIDs
# fixos: dashboards e regras de alerta referenciam "prometheus", "loki" e
# "tempo". Correlação: trace_id do log JSON → trace no Tempo, e o inverso.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Ver trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        customQuery: true
        query: '{service="app"} |= "$${__trace.traceId}"'
      nodeGraph:
        enabled: false

# Alertas mínimos (task 0007, RF06) — lista FECHADA do refinamento E0d,
# + 1 do refinamento E1 (task 0010: reuso de refresh token), + 2 da reserva (E4)
# + 5 da saga do checkout (refinamento E6, task 0026), + 2 do e-mail (E7, task 0029)
# + 1 da trilha de auditoria (refinamento E9, task 0037: purga parada).
# Grafana-managed; roteados ao Discord. Webhook só via env ($DISCORD_WEBHOOK_URL).
# Cada regra segue o padrão A (query instantânea) → C (threshold). Nova regra
# exige atualizar o PRD — a lista é fechada ("sem mais um alerta").
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-morfeu
    receivers:
      - uid: discord-morfeu
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
          use_discord_username: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord-morfeu
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: morfeu
    folder: Morfeu
    interval: 1m
    rules:
      - uid: morfeu-disco-80
        title: "Disco acima de 80%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: '1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint="/"})'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Disco acima de 80%"
          description: "Disco da VM acima de 80% — risco nº 1 (Loki/Prometheus/PG no mesmo disco)."
      - uid: morfeu-api-fora
        title: "API fora do ar"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(up{job="morfeu"}) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "API fora do ar"
          description: "Prometheus não consegue raspar o /metrics do app."
      - uid: morfeu-erro-5xx
        title: "Taxa de erro 5xx acima de 5%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1e-9)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro 5xx acima de 5%"
          description: "Limite provisório até o SLO formal do E10."
      - uid: morfeu-dlq-crescendo
        title: "DLQ crescendo"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(delta(morfeu_dlq_mensagens[15m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "DLQ crescendo"
          description: "Mensagens novas na DLQ nos últimos 15 minutos — investigar (replay só no E6)."
      - uid: morfeu-consumidor-parado
        title: "Consumidor parado"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(rabbitmq_detailed_queue_messages_ready{queue="catalogo.filme_criado"}) > 0 and on() max(rabbitmq_detailed_queue_consumers{queue="catalogo.filme_criado"}) == 0'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Consumidor parado"
          description: "Há mensagens prontas em catalogo.filme_criado e nenhum consumidor conectado."
      - uid: morfeu-pg-conexoes
        title: "Conexões do PostgreSQL acima de 80%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(pg_stat_activity_count) / max(pg_settings_max_connections)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.8]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Conexões do PostgreSQL acima de 80%"
          description: "Pool/conexões perto do limite de max_connections."
      - uid: morfeu-refresh-reuso
        title: "Reuso de refresh token detectado"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(auth_refresh_reuso_total[15m])) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Reuso de refresh token detectado"
          description: "Token de refresh já usado/revogado foi reapresentado — família revogada; possível roubo de sessão (task 0010). Falso positivo conhecido até o single-flight do SPA (E8): logout numa aba seguido de refresh em outra."
      - uid: morfeu-trava-recusas
        title: "Recusas de trava de assento anormais"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(reserva_holds_indisponiveis_total[5m])) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [60]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Recusas de trava de assento anormais"
          description: "Mais de 60 travas recusadas (409 assento_indisponivel) em 5 min — disputa real de lançamento ou bot varrendo assentos (PRD 0016). Conferir o rate limit e os logs de trava."
      - uid: morfeu-sweeper-parado
        title: "Sweeper de holds parado"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 = nenhuma passada do sweeper em 10 min com a API no ar.
              expr: '((sum(increase(reserva_sweeper_execucoes_total[10m])) or vector(0)) < bool 1) and on() (max(up{job="morfeu"}) == 1)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Sweeper de holds parado"
          description: "Nenhuma passada do sweeper de holds em 10 min. A trava continua correta (o upsert rouba vencidos — ADR 0008), mas a tabela holds acumula 'ativo' vencidos; verificar o worker."
      - uid: morfeu-saga-estorno
        title: "Estorno automático executado"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(saga_compensacoes_total{passo="estorno"}[10m])) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Estorno automático executado"
          description: "Um pagamento não pôde virar venda (divergência, pagamento tardio ou assento perdido) e foi estornado (ADR 0010). Isolado é esperado; repetido indica problema no checkout — ver logs do pedido pelo pedido_id. Cancelamentos (ADR 0011) não contam aqui — ver cancelamentos_total."
      - uid: morfeu-saga-estorno-preso
        title: "Estorno pendente há mais de 30 min"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(pedidos_presos{estado="estorno_pendente"}) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Estorno pendente há mais de 30 min"
          description: "Dinheiro a devolver (pagamento sem venda ou pedido cancelado) e o estorno não concluiu (gateway fora, breaker aberto ou erro persistente). Ver os logs ‘estorno falhou’ e o gateway; o job repete com backoff até 1 h."
      - uid: morfeu-saga-reconciliacao-parada
        title: "Pedidos vencidos não reconciliados"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(pedidos_presos{estado="aguardando_vencido"}) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Pedidos vencidos não reconciliados"
          description: "Há pedidos aguardando pagamento vencidos além da margem do hold: a reconciliação do worker não está rodando ou o gateway recusa as consultas. Assentos presos e pagamentos possivelmente sem webhook."
      - uid: morfeu-gateway-breaker
        title: "Circuit breaker do gateway aberto"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(gateway_breaker_state) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker do gateway aberto"
          description: "5 falhas seguidas no Stripe: novos pedidos recebem 503 e os assentos voltam. Verificar status.stripe.com e a rede da VM."
      - uid: morfeu-saga-latencia
        title: "Confirmação → notificação lenta (p95 > 5 s)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # SLI do checkout fim a fim (PRD 0026); sem dados = sem compras (OK).
              expr: 'histogram_quantile(0.95, sum by (le) (rate(checkout_confirmado_ate_notificado_segundos_bucket[10m])))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [5]}
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Confirmação → notificação lenta"
          description: "p95 entre o pagamento confirmado e a notificação processada acima de 5 s (SLI do checkout fim a fim, doc.md §13): relay da outbox lento, broker ou consumidor atrasados."
      - uid: morfeu-email-recusado
        title: "E-mail recusado ou cota esgotada"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(increase(morfeu_email_envios_total{resultado=~"permanente|cota"}[15m])) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "E-mail recusado ou cota esgotada"
          description: "O provedor recusou um e-mail (4xx) ou a cota do plano grátis acabou (Resend: 100/dia): a mensagem foi para a DLQ notificacao.pedido_confirmado.dlq. Cota → replay-dlq no dia seguinte; recusa → ver o log pelo pedido_id (401/403 em série = chave revogada: trocar RESEND_API_KEY e fazer o replay). A venda segue válida (pós-pivô)."
      - uid: morfeu-email-falhando
        title: "Falhas de envio de e-mail acima de 20%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(sum(increase(morfeu_email_envios_total{resultado="transitorio"}[15m])) / clamp_min(sum(increase(morfeu_email_envios_total[15m])), 1)) and on() (sum(increase(morfeu_email_envios_total[15m])) >= 5)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.2]}
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Falhas de envio de e-mail acima de 20%"
          description: "Mais de 20% das entregas falharam de forma transitória em 15 min (com ao menos 5 envios): provedor instável ou rede. As mensagens voltam à fila e, após 3 tentativas, vão à DLQ."
      - uid: morfeu-auditoria-purga-parada
        title: "Purga da trilha de auditoria parada há mais de 48 h"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'time() - max(auditoria_purga_ultima_execucao_timestamp)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [172800]}
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Purga da trilha de auditoria parada"
          description: "A purga diária (retenção de 12 meses — doc.md §10) não conclui há mais de 48 h: worker parado ou erro no DELETE (ver log ‘purga da trilha de auditoria’). Sem ela a tabela eventos_auditoria só cresce."

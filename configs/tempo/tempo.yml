# Tempo monolítico (task 0040, ADR 0012): recebe do Alloy (OTLP gRPC, rede
# interna — sem porta publicada), guarda no disco local e retém 72 h.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 5000000
      burst_size_bytes: 10000000
    global:
      max_bytes_per_trace: 2000000

usage_report:
  reporting_enabled: false

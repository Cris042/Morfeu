services:
  postgres:
    image: postgres:16-alpine
    container_name: morfeu-postgres
    env_file: .env.docker-compose
    environment:
      POSTGRES_DB: morfeu
    ports:
      - "5432:5432"
    volumes:
      - morfeu-postgres:/var/lib/postgresql/data
      # Usuário de leitura mínima do postgres-exporter (task 0007). Só roda em
      # volume novo — volume existente: ver docs/observabilidade.md.
      - ./configs/postgres/01-usuario-monitoracao.sh:/docker-entrypoint-initdb.d/01-usuario-monitoracao.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morfeu-network

  redis:
    image: redis:7-alpine
    container_name: morfeu-redis
    ports:
      - "6379:6379"
    volumes:
      - morfeu-redis:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morfeu-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: morfeu-rabbitmq
    env_file: .env.docker-compose
    ports:
      - "5672:5672"
      # UI de management só em localhost (RNF02) — nunca exposta na rede.
      - "127.0.0.1:15672:15672"
    volumes:
      - morfeu-rabbitmq:/var/lib/rabbitmq
      - ./configs/rabbitmq.conf:/etc/rabbitmq/conf.d/10-morfeu.conf:ro
      # management + rabbitmq_prometheus (:15692, só na rede interna — task 0007).
      - ./configs/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morfeu-network

  # App no compose (profile "app", task 0007): `docker compose --profile app up`.
  # Sem profile, `docker compose up` segue subindo só a infra (dev com `go run`).
  # Sem porta publicada além da 8080 local; /metrics só é raspado pela rede
  # interna. Imagem scratch não tem shell → sem healthcheck próprio.
  app:
    build: .
    image: morfeu:dev
    container_name: morfeu-app
    profiles: ["app"]
    command: ["-mode=all"]
    # Shutdown gracioso (PRD 0027): a entrega em curso termina em até 30 s
    # (processamentoTimeout) antes do SIGKILL — o padrão de 10 s a cortaria.
    stop_grace_period: 45s
    env_file: .env.docker-compose
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - morfeu-network

  # Stripe CLI (profile "stripe", task 0024): encaminha os webhooks do modo de
  # teste para o app, sem túnel. Uso: `docker compose --profile app --profile
  # stripe up`; o segredo de assinatura sai em `docker compose logs stripe-cli`
  # (copie para STRIPE_WEBHOOK_SECRET). Só dev — nunca vai para a VM.
  stripe-cli:
    image: stripe/stripe-cli:v1.52.1
    container_name: morfeu-stripe-cli
    profiles: ["stripe"]
    command: ["listen", "--forward-to", "app:8080/webhooks/stripe", "--events", "payment_intent.succeeded,payment_intent.payment_failed"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    networks:
      - morfeu-network

volumes:
  morfeu-postgres:
  morfeu-redis:
  morfeu-rabbitmq:

networks:
  morfeu-network:
    driver: bridge
